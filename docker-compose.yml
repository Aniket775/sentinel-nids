version: "3.9"

services:
  sentinel-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-nids-production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
